<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#4CAF50"/>
  
  <!-- Battery body -->
  <rect x="60" y="80" width="120" height="96" rx="8" ry="8" fill="white"/>
  
  <!-- Battery terminal -->
  <rect x="180" y="110" width="16" height="36" rx="4" ry="4" fill="white"/>
  
  <!-- Battery inner (dark) -->
  <rect x="68" y="88" width="104" height="80" rx="4" ry="4" fill="#2E7D32"/>
  
  <!-- Lightning bolt -->
  <polygon points="140,88 100,136 124,136 116,168 156,120 132,120" fill="#FFEB3B"/>
</svg>
